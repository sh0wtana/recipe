default: &default
  store_options:
    # Cap age of oldest cache entry to fulfill retention policies
    # max_age: <%= 60.days.to_i %>
    # 256MB is the Rails default, sized for real traffic. The volume this shares
    # with the recipe photos is 3GB, so a quarter of it would go to two people's
    # cache.
    max_size: <%= 64.megabytes %>
    namespace: <%= Rails.env %>

development:
  <<: *default

test:
  <<: *default

production:
  database: cache
  <<: *default
