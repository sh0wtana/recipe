app = "my-recipe-memo"
primary_region = "nrt"

# Rails 8 with Puma idles at 200-250MB on 512MB. Swap turns a would-be OOM kill
# during libvips variant generation into a slowdown. It also rules out
# auto_stop_machines = "suspend", which requires a machine with no swap.
swap_size_mb = 512

[build]

[env]
  # Run the Solid Queue supervisor inside Puma. A separate process group would
  # need a second machine, and the only jobs here are Active Storage analysis
  # and purging.
  SOLID_QUEUE_IN_PUMA = "true"

  # Thruster defaults to port 80, which the container cannot bind: the Dockerfile
  # runs it as uid 1000 and Linux reserves ports below 1024 for root. Docker grants
  # CAP_NET_BIND_SERVICE by default so this works under Kamal, but Fly's Firecracker
  # VMs do not, and Thruster exits 1 into a restart loop.
  HTTP_PORT = "8080"

[http_service]
  # Matches HTTP_PORT above. Thruster proxies from here to Puma on TARGET_PORT (3000).
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # "memory", not "memory_mb". The latter is not a valid key and is ignored
  # without warning, which would silently boot the machine at the default size.
  memory = "512mb"

[mounts]
  # The SQLite databases and the Active Storage files both live here, so one
  # snapshot restores the recipes and their photos at the same instant.
  source = "storage"
  destination = "/rails/storage"
  # Photos dominate the space: 10MB is allowed per photo, plus two variants.
  # A volume can be extended later but never shrunk.
  initial_size = "3gb"
  # Snapshots are the only safety net here. The default 5 days does not cover
  # noticing weeks later that a recipe was deleted.
  snapshot_retention = 30

[deploy]
  # A volume attaches to one machine at a time, so a rolling deploy cannot work.
  strategy = "immediate"
